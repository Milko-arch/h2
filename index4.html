 1: Blockade`,value:`Seal the Ports`,sublabel:`Stop cotton exports & weapon imports`,color:`bg-blue-600`,icon:`🚢`},{label:`Part 2: Mississippi`,value:`Divide the South`,sublabel:`Split Texas & Arkansas from east`,color:`bg-emerald-600`,icon:`🌊`},{label:`Part 3: Richmond`,value:`Capture Capital`,sublabel:`March on Confederate capital city`,color:`bg-amber-600`,icon:`🏛️`}]},questionIds:[34,35,36]},{id:12,number:12,worldId:3,title:`The War in the East`,titleEs:`La Guerra en el Este`,emoji:`⚔️`,color:`from-red-500 to-rose-700`,description:`First Bull Run shatters hopes for a quick war; Antietam becomes the bloodiest single day.`,keyPoints:[`The First Battle of Bull Run (Manassas) was the war's first major battle, proving it would be long and brutal.`,`The Battle of Antietam was the single bloodiest day in U.S. history with over 22,000 casualties.`,`The Union victory at Antietam gave Lincoln the momentum to announce the Emancipation Proclamation.`],graphic:{type:`timeline`,title:`Clashes in Virginia & Maryland`,description:`Key early battles in the eastern theater`,iconName:`Swords`,visualData:[{label:`July 1861`,value:`1st Bull Run`,sublabel:`Shattered illusion of a 90-day war`,color:`bg-amber-600`,icon:`💥`},{label:`Sept 17, 1862`,value:`Antietam`,sublabel:`22,000+ casualties in 12 hours`,color:`bg-red-600`,icon:`🩸`},{label:`Result`,value:`Union Victory`,sublabel:`Lincoln issues freedom proclamation`,color:`bg-blue-600`,icon:`📜`}]},questionIds:[37,38,39]},{id:13,number:13,worldId:4,title:`The Emancipation Proclamation`,titleEs:`La Proclamación de Emancipación`,emoji:`🕊️`,color:`from-sky-500 to-blue-600`,description:`Jan 1, 1863: Enslaved people in Confederate states declared free, and Black men enlist in the military.`,keyPoints:[`Issued by President Lincoln on January 1, 1863.`,`Declared all enslaved people in Confederate states in rebellion to be forever free.`,`Allowed African American men to enlist in the Union Army and Navy (nearly 200,000 served!).`],graphic:{type:`cards`,title:`A Turning Point for Freedom`,description:`How the Proclamation reshaped the war`,iconName:`Award`,visualData:[{label:`Moral Cause`,value:`Ending Slavery`,sublabel:`Civil War became a war for freedom`,color:`bg-sky-500`,icon:`🕊️`},{label:`Black Troops`,value:`200,000 Soldiers`,sublabel:`Served heroically in Army & Navy`,color:`bg-blue-600`,icon:`🎖️`},{label:`Europe Out`,value:`No 3rd Party Aid`,sublabel:`Britain & France refused to back slavery`,color:`bg-emerald-500`,icon:`🌍`}]},questionIds:[40,41,42]},{id:14,number:14,worldId:4,title:`The Generals: Lee vs. Grant`,titleEs:`Los Generales: Lee vs. Grant`,emoji:`⭐`,color:`from-indigo-500 to-slate-700`,description:`The two great leaders: Robert E. Lee's tactical brilliance vs Ulysses S. Grant's relentless determination.`,keyPoints:[`General Robert E. Lee was the brilliant strategist commanding the Confederate Army of Northern Virginia.`,`General Ulysses S. Grant was the tough, tenacious Union leader who never retreated.`,`Grant famously said: 'I propose to fight it out on this line if it takes all summer.'`],graphic:{type:`comparison`,title:`Commander Face-Off`,description:`The two masterminds who met at Appomattox`,iconName:`Shield`,visualData:[{label:`Gen. Ulysses S. Grant`,value:`Union Commander`,sublabel:`'Unconditional Surrender' / Relentless`,color:`bg-blue-600`,icon:`🧔🏻`},{label:`Gen. Robert E. Lee`,value:`Confederate Leader`,sublabel:`Audacious tactician / 'Marble Man'`,color:`bg-slate-600`,icon:`👨🏼‍🦳`},{label:`Grant's Motto`,value:`'Fight It Out'`,sublabel:`Even if it takes all summer`,color:`bg-amber-600`,icon:`⚡`}]},questionIds:[43,44,45]},{id:15,number:15,worldId:4,title:`Johnny Reb and Billy Yank`,titleEs:`Johnny Reb y Billy Yank`,emoji:`🪖`,color:`from-blue-600 to-slate-600`,description:`Step into the boots of the common soldier: blue uniforms vs gray uniforms, hardtack, and camp life.`,keyPoints:[`The common Union soldier was nicknamed 'Billy Yank' and wore a blue uniform.`,`The common Confederate soldier was nicknamed 'Johnny Reb' and wore a gray uniform.`,`Soldiers ate hard crackers called 'hardtack', marched long miles, and spent 90% of time in camp.`],graphic:{type:`comparison`,title:`Blue vs Gray Soldiers`,description:`Uniforms and nicknames of the infantrymen`,iconName:`Shirt`,visualData:[{label:`Billy Yank`,value:`Union Blue`,sublabel:`Wool sack coat, kepi cap, rifle`,color:`bg-blue-700`,icon:`🔵`},{label:`Johnny Reb`,value:`Confederate Gray`,sublabel:`Gray/butternut coat, slouch hat`,color:`bg-slate-500`,icon:`⚪`},{label:`Daily Ration`,value:`Hardtack & Coffee`,sublabel:`Rock-hard flour crackers & bacon`,color:`bg-amber-700`,icon:`🍞`}]},questionIds:[46,47,48]},{id:16,number:16,worldId:4,title:`Women & the War Effort`,titleEs:`Las Mujeres y el Esfuerzo Bélico`,emoji:`👩‍⚕️`,color:`from-rose-400 to-pink-600`,description:`Clara Barton and the heroines who cared for wounded soldiers and kept family farms running.`,keyPoints:[`Thousands of courageous women served as battlefield nurses treating sick and injured soldiers.`,`Clara Barton, the 'Angel of the Battlefield', went right to the front lines and later founded the American Red Cross.`,`At home, women sewed uniforms, rolled bandages, prepared supplies, and managed family farms and businesses.`],graphic:{type:`cards`,title:`Heroines on Frontline & Home`,description:`Dedication and bravery of Civil War women`,iconName:`HeartHandshake`,visualData:[{label:`Clara Barton`,value:`American Red Cross`,sublabel:`Founded Red Cross in 1881`,color:`bg-rose-500`,icon:`❤️`},{label:`Battlefield Nurses`,value:`Saved Lives`,sublabel:`Cleaned wounds, administered medicine`,color:`bg-pink-500`,icon:`🩹`},{label:`Home Front`,value:`Ran Farms & Shops`,sublabel:`Made uniforms, raised vital aid funds`,color:`bg-purple-500`,icon:`🏡`}]},questionIds:[49,50,51]},{id:17,number:17,worldId:5,title:`The Tide Turns: Gettysburg & Vicksburg`,titleEs:`Cambia la Marea: Gettysburg y Vicksburg`,emoji:`🏆`,color:`from-amber-500 to-yellow-
